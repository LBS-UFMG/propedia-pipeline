machine:
  cif_dir:      "/home/arcanjomjr/new_propedia_files/cif"     # where CIFs download to (needs ~50GB)
  oracle_csv:   "/home/arcanjomjr/old_propedia/propedia26_v15.csv"  # reference DB for validation
  multipro_oracle_csv: "/home/arcanjomjr/old_propedia/multipro_v4.csv"  # multipro reference DB
  cocada_dir:   "~/COCaDA"                                     # cloned COCaDA repo
  ccp4_dir:     "/opt/xtal/ccp4-9"                             # CCP4 root (for PISA); has bin/pisa + share/pisa/pisa.cfg
  signa_dir:    "~/signa/Signa"                                # cloned SIGNA (dir with signa.py)
  ifeature_dir: "~/iFeature"                                   # cloned iFeature repo
  ml_train_dir: "~/signa/docs/case_studies/cs4/csv"            # therapeutic-class train/test sets

# ---- run mode: "sample" (fast, validates) or "full" (whole snapshot) ----
mode: "sample"
sample:
  size: 300
  seed: 42        # seeded-random sample across all downloaded oracle IDs (reproducible)

# ---- data snapshot ----
pdb_snapshot_date: "2026-08-30"

# ---- selection / cutoffs ----
# Defaults reproduce Propedia's published selection; each is justified in
# docs/reproduction_notes.md ("Selection cutoffs"). To test alternatives without
# clobbering the canonical build, use a `variant` (see cutoff_variants below).
cutoffs:
  interaction_distance_A: 6.0   # peptide-protein contact distance defining an interface.
                                # 6 A is Propedia's convention and PRODIGY's default contact
                                # radius; captures side-chain contacts beyond direct H-bonds.
  bsa_threshold_A2: 0.0         # keep a pair only if it buries surface area (BSA > 0), i.e.
                                # a real interface exists. 0.0 = "any nonzero burial".
  peptide_len_min: 2            # peptides are 2-50 residues (the operational peptide
  peptide_len_max: 50           # definition used throughout Propedia); >50 -> treated as protein.
  protein_len_min: 51           # receptor chain must be > peptide_len_max to be the "protein".
  max_atoms_per_structure: 0    # PERF/size gate: skip input structures with more than this
                                # many atoms (huge complexes, e.g. ribosomes, dominate runtime
                                # and memory). 0 = no limit. This is a MEMBERSHIP filter, not a
                                # compute param: over-limit PDBs never enter pairs.tsv (so they
                                # are never parsed and never cascade downstream), but the filter
                                # is NOT part of the checkpoint signature — already-computed
                                # entries are preserved, and RAISING this limit later re-admits
                                # the previously-skipped structures as new work without
                                # recomputing or losing anything. Atom counts are cached in
                                # state/<mode>/atom_counts.tsv. NOT a format limit: the mmCIF
                                # intermediate itself has no atom/chain-ID ceiling.

# ---- alt-threshold datasets (cutoff sensitivity analysis) ----
# Set `variant` (below or via --config) to build an ALTERNATIVE dataset under
# results/<mode>__<variant>/ + state/<mode>__<variant>/ WITHOUT overwriting the default
# build. If the variant names a key here, its cutoff overrides are applied automatically
# (interaction_distance_A also retunes prodigy.distance_cutoff). Example:
#   snakemake --cores 8 --config mode=full variant=dist8
# Add your own profiles freely; the label becomes the output-tree suffix.
variant: ""                     # "" = canonical build (results/<mode>/)
cutoff_variants:
  dist5:      {interaction_distance_A: 5.0}   # stricter contact distance
  dist8:      {interaction_distance_A: 8.0}   # looser contact distance
  bsa10:      {bsa_threshold_A2: 10.0}        # require a more substantial buried interface
  pep2_30:    {peptide_len_max: 30, protein_len_min: 31}   # tighter peptide-length window

collection:
  strategy: "prefilter-permissive"
  protein_polymer_type: "Protein"
  min_polymer_chains: 2

download:
  workers: 16
  max_retries: 4
  timeout_seconds: 60

prodigy:
  distance_cutoff: 6.0
  temperature: 25.0

cocada:
  ph: 7.4
  version: "v1.6"

pisa:
  timeout: 600                 # seconds per pisa call; a timed-out structure is recorded blank
  on_missing: "skip"           # CCP4/PISA absent: "skip" => build without PISA (blank cols,
                               # pisa_status='pisa_unavailable'); "error" => fail the run.
                               # Use "error" for the production release to enforce PISA.
  # Derived biological-vs-crystal interface annotation (answers the "crystal-packing
  # artifacts" reviewer comment). PISA's Complexation Significance Score (CSS, 0-1)
  # measures how much an interface drives the biological assembly: high CSS => biological,
  # ~0 => likely crystal packing. An entry is labelled biological when css >= this
  # threshold, crystal-packing when below it, and indeterminate when PISA gave no CSS.
  css_biological_threshold: 0.5   # 0.5 = PISA's "significant assembly driver" convention
                                  # (working value; may be revisited before the production
                                  # run). Set to 0 for the permissive "any nonzero CSS".

signatures:
  acsm_cutoff_limit: 10
  acsm_cutoff_step: 0.2
  acsm_cumulative: true
  min_signature_len: 3
  ifeature_descriptors: [AAC, DPC, DDE, GAAC, GDPC, GTPC, CTDC, CTDT, CTDD]

ml:
  classes: [AAP, ABP, ACP, AIP, QSP, SBP]
  train_dir: "~/propedia26-sm/data/csm-peptides/features/new/train"
  test_dir:  "~/propedia26-sm/data/csm-peptides/features/new/test"

compute:
  threads: 8      # pool size for the checkpointed per-entry stages; set to 64 on
                  # the lab box, then run `snakemake --cores 64`. Raising this is
                  # the whole parallelism tuning step — no code change needed.

# ---- website packaging (`snakemake package`) ----
package:
  # web_dir default = results/<mode>/web (standalone tree to rsync into propedia26).
  # Column-order files (one column name per line) permute the per-entry CSVs to the
  # site's final layout. Target->source matching is case-insensitive, so v17 PISA_*
  # cols resolve to our pisa_*; v17 columns we don't compute (the 14 richer PISA
  # fields) fall through to blank. Derived+validated against the web repo's shipped
  # propedia26_v17.csv + examples/csv/1/1WRZ-B-A.csv.
  column_order: "config/columns_peppro_v17.txt"
  # Master bulk-download filenames at data/ root. These MUST match the site's
  # hardcoded links: the Explore table + Entry PISA-CSS read the .tsv; Blast reads
  # peptides.fasta/receptors.fasta; the Download page links these .csv/.zip names.
  # (propedia27-beta bumped the multipro master to v5; pep-pro stays v17.)
  peppro_csv_name: "propedia26_v17.csv"
  multipro_csv_name: "multipro_v5.csv"
  explore_tsv_name: "propedia26_v17.tsv"
  # The website serves per-entry data from a fixed subdir ($modo = 'db'). Writing the
  # packaged tree straight into data/db/ makes deployment a pure rsync (no rename step).
  web_mode_name: "db"
  # Bulk-download ZIP names (`snakemake zips`). The Download page serves the peptide
  # and multipro structure zips from data/db/; propedia27-beta labels the multipro
  # PDB zip v7. The pep-pro complexes zip (peppro) is offloaded to Zenodo, not the
  # server, so its local name is irrelevant here.
  zip_names:
    multipro: "multipro_v7.zip"
  column_order_multipro: ""        # none needed: multipro_final.csv is ALREADY in the site's
                                   # v4 per-entry order (verified: our V4_ORDER == web v4
                                   # header); our 4 additive cols trail [64..67] and the site
                                   # (reads by fixed index [0..63]) ignores them.

paths:
  results_dir: "results"   # DERIVED outputs (TSVs/CSVs/report) — safe to wipe; rebuilt from state
  # web_dir:   "/path/to/propedia26/public"   # uncomment to package straight into the site
  state_dir:   "state"     # DURABLE database memory: per-entry checkpoints + extracted
                           # structures. PRESERVE & BACK UP between releases — this is what
                           # lets an update fill in only new PDB entries. (git-ignored)

clusters:
  legacy_dir: "~/propedia26-sm/data/clusters_v15"